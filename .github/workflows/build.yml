name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Inject version from git tag
        shell: bash
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            VERSION="${{ github.ref_name }}"
            VERSION="${VERSION#v}"
          else
            VERSION="dev"
          fi
          printf '__version__ = "%s"\n' "$VERSION" > core/_version.py

      - name: Build with PyInstaller
        run: |
          pyinstaller --noconfirm --onefile --windowed --name TrailerMatch main.py

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: TrailerMatch-exe
          path: dist/TrailerMatch.exe
          if-no-files-found: error

      - name: Create GitHub Release (on version tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/TrailerMatch.exe
          generate_release_notes: true
